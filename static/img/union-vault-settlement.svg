<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="title desc">
  <title id="title">Union Vault daily settlement</title>
  <desc id="desc">Each day, validator rewards that flowed into the vault are settled. The staker allocation equals inflow times 60 percent times staked divided by cap, and is streamed to stakers over 24 hours. Everything else is burned to the dEaD address. Occupied seats earn; the yield attached to empty seats is burned.</desc>

  <style>
    .bg    { fill: #ffffff; }
    .card  { fill: #f8fafc; stroke: #cbd5e1; }
    .mint  { fill: #eef2ff; stroke: #6366f1; }
    .pay   { fill: #ecfdf5; stroke: #10b981; }
    .burn  { fill: #fef2f2; stroke: #f97316; }
    .seat  { fill: #ecfdf5; stroke: #10b981; }
    .empty { fill: #f1f5f9; stroke: #cbd5e1; }
    .t     { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, sans-serif; }
    .sub   { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, sans-serif; }
    .mono  { fill: #0f172a; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .arrow { stroke: #94a3b8; }
    .arrowhead { fill: #94a3b8; }
    .ok    { fill: #059669; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, sans-serif; }
    .hot   { fill: #ea580c; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, sans-serif; }

    @media (prefers-color-scheme: dark) {
      .bg    { fill: #1b1b1d; }
      .card  { fill: #26282c; stroke: #3f4450; }
      .mint  { fill: #232645; stroke: #818cf8; }
      .pay   { fill: #12302a; stroke: #34d399; }
      .burn  { fill: #33211a; stroke: #fb923c; }
      .seat  { fill: #12302a; stroke: #34d399; }
      .empty { fill: #24262a; stroke: #3f4450; }
      .t     { fill: #f1f5f9; }
      .sub   { fill: #a9b1bd; }
      .mono  { fill: #f1f5f9; }
      .arrow { stroke: #6b7280; }
      .arrowhead { fill: #6b7280; }
      .ok    { fill: #34d399; }
      .hot   { fill: #fb923c; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="900" height="470" rx="12"/>

  <!-- Inflow -->
  <rect class="mint" x="300" y="24" width="300" height="66" rx="10" stroke-width="1.5"/>
  <text class="t" x="450" y="52" text-anchor="middle" font-size="16" font-weight="700">Validator rewards earned by the node</text>
  <text class="sub" x="450" y="74" text-anchor="middle" font-size="13">settled once per day · permissionless</text>

  <path class="arrow" d="M450 90 V112" stroke-width="1.5" fill="none"/>
  <polygon class="arrowhead" points="450,122 444,110 456,110"/>

  <!-- Formula -->
  <rect class="card" x="215" y="124" width="470" height="58" rx="10" stroke-width="1.5"/>
  <text class="mono" x="450" y="150" text-anchor="middle" font-size="14">staker allocation = inflow × 60% × (staked ÷ cap)</text>
  <text class="sub" x="450" y="170" text-anchor="middle" font-size="13">everything else is burned</text>

  <!-- Split arrows -->
  <path class="arrow" d="M450 182 V202" stroke-width="1.5" fill="none"/>
  <path class="arrow" d="M245 202 H655" stroke-width="1.5" fill="none"/>
  <path class="arrow" d="M245 202 V228" stroke-width="1.5" fill="none"/>
  <path class="arrow" d="M655 202 V228" stroke-width="1.5" fill="none"/>
  <polygon class="arrowhead" points="245,238 239,226 251,226"/>
  <polygon class="arrowhead" points="655,238 649,226 661,226"/>

  <!-- Stakers -->
  <rect class="pay" x="105" y="240" width="280" height="80" rx="10" stroke-width="1.5"/>
  <text class="t" x="245" y="268" text-anchor="middle" font-size="15" font-weight="700">Stakers</text>
  <text class="ok" x="245" y="290" text-anchor="middle" font-size="13" font-weight="600">streamed over 24 h, per second</text>
  <text class="sub" x="245" y="309" text-anchor="middle" font-size="13">claim any time · no expiry</text>

  <!-- Burn -->
  <rect class="burn" x="515" y="240" width="280" height="80" rx="10" stroke-width="1.5"/>
  <text class="t" x="655" y="268" text-anchor="middle" font-size="15" font-weight="700">Permanent burn</text>
  <text class="hot" x="655" y="290" text-anchor="middle" font-size="13" font-weight="600">40% + the yield of empty seats</text>
  <text class="sub" x="655" y="309" text-anchor="middle" font-size="13">sent to 0x…dEaD</text>

  <!-- Seat model -->
  <text class="t" x="60" y="368" font-size="14" font-weight="700">Reserved seats (the cap)</text>
  <text class="sub" x="60" y="388" font-size="13">Each seat is paid for itself only — your APR does not depend on how many others join.</text>

  <g>
    <rect class="seat" x="60" y="402" width="86" height="42" rx="8" stroke-width="1.5"/>
    <text class="t" x="103" y="422" text-anchor="middle" font-size="12" font-weight="600">taken</text>
    <text class="ok" x="103" y="437" text-anchor="middle" font-size="11">earns</text>

    <rect class="seat" x="156" y="402" width="86" height="42" rx="8" stroke-width="1.5"/>
    <text class="t" x="199" y="422" text-anchor="middle" font-size="12" font-weight="600">taken</text>
    <text class="ok" x="199" y="437" text-anchor="middle" font-size="11">earns</text>

    <rect class="seat" x="252" y="402" width="86" height="42" rx="8" stroke-width="1.5"/>
    <text class="t" x="295" y="422" text-anchor="middle" font-size="12" font-weight="600">taken</text>
    <text class="ok" x="295" y="437" text-anchor="middle" font-size="11">earns</text>

    <rect class="empty" x="348" y="402" width="86" height="42" rx="8" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text class="sub" x="391" y="422" text-anchor="middle" font-size="12" font-weight="600">empty</text>
    <text class="hot" x="391" y="437" text-anchor="middle" font-size="11">burned</text>

    <rect class="empty" x="444" y="402" width="86" height="42" rx="8" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text class="sub" x="487" y="422" text-anchor="middle" font-size="12" font-weight="600">empty</text>
    <text class="hot" x="487" y="437" text-anchor="middle" font-size="11">burned</text>
  </g>

  <rect class="card" x="560" y="396" width="280" height="54" rx="10" stroke-width="1.5"/>
  <text class="sub" x="700" y="418" text-anchor="middle" font-size="12.5">Cap full → exactly 60 / 40</text>
  <text class="sub" x="700" y="437" text-anchor="middle" font-size="12.5">No stakers → 100% burned</text>
</svg>
